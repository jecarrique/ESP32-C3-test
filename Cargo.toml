[package]
name = "esp32c3-led-blink"
version = "0.1.0"
edition = "2021"

[dependencies]
# Apuntamos al repositorio oficial de la comunidad para asegurar compatibilidad total
esp-hal = { git = "https://github.com/esp-rs/esp-hal", tag = "v0.22.0", features = ["esp32c3"] }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", tag = "v0.22.0", features = ["esp32c3", "panic-handler", "exception-handler", "println"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", tag = "v0.22.0", features = ["esp32c3", "log"] }
esp-hal-smart-leds = { git = "https://github.com/esp-rs/esp-hal", tag = "v0.22.0" }

smart-leds = "0.4.0"

[profile.release]
opt-level = "s"

[profile.dev]
opt-level = "s"
