[package]
name = "esp32c3-rgb-blink"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "esp32c3-rgb-blink"
harness = false

[dependencies]
log = { version = "0.4", default-features = false }
esp-idf-svc = { version = "0.49", features = ["alloc"] }
ws2812-esp32-rmt-driver = { version = "0.9", features = ["smart-leds-trait"] }
smart-leds = "0.4"

[build-dependencies]
embuild = "0.32"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
