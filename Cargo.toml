[package]
name = "esp32c3-led-blink"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-hal = { version = "0.22.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.14.0", features = ["esp32c3", "panic-handler", "exception-handler", "println"] }
esp-println = { version = "0.12.0", features = ["esp32c3", "log"] }
smart-leds = "0.4.0"
esp-hal-smart-leds = "0.15.0"

[profile.release]
opt-level = "s"

[profile.dev]
opt-level = "s"
